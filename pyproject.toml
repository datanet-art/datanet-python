[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "datanet-sdk"
version = "0.1.0"
description = "DataNet Python SDK — async realtime pub/sub client for the DataNet platform"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "DataNet", email = "dev@datanet.art" }]
keywords = ["datanet", "websocket", "realtime", "iot", "pub-sub"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Framework :: AsyncIO",
]
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "aioresponses>=0.7",
]

[project.urls]
Homepage = "https://datanet.art"
Repository = "https://github.com/datanet-art/datanet-python"
Documentation = "https://datanet.art/docs"

[tool.hatch.build.targets.wheel]
packages = ["datanet"]

[tool.hatch.build.targets.sdist]
include = [
    "/datanet",
    "/examples",
    "/tests",
    "/LICENSE",
    "/README.md",
    "/PROTOCOL.md",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
